<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricette del Cucix - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="back-button">
        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <polyline 
                points="14 6 8 12 14 18" 
                fill="none" 
                stroke="currentColor" 
                stroke-width="2" 
                stroke-linecap="round" 
                stroke-linejoin="round"
            />
        </svg>
    </div>

    <header>
        <h1 id="titolo-pagina" class="translate">Panini</h1>
        <h2 id="desc-pagina" class="translate">Panini tra cui: Hotdog, Hamburber, Tramezzi fatti personalmente, Toast</h2>
        <h2 id="container-language-selection">
            <span id="language-ITA" class="wave-animation-element language selected">ITA</span>
            <span class="wave-animation-element">&diams;</span>
            <span id="language-ENG" class="wave-animation-element language not-selected">ENG</span>
            <span class="wave-animation-element">&diams;</span>
            <span id="language-JAP" class="wave-animation-element language not-selected">JAP</span>
        </h2>
    </header>

    <main id="category-selection">
    </main>

    <footer>

    </footer>
    <script src="pageSystem.js"></script>
    <script src="scriptMain.js"></script>
</body>
</html>
