<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricette del Cucix - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="titolo-pagina" class="translate">Le ricette del Cucix</h1>
        <h2 id="desc-pagina" class="translate">Ricette fai da te, testate personalmente, con indicazione delle marche, dei prezzi degli ingredienti e tanti dettagli utili. Ogni ricetta include consigli pratici, varianti e trucchi per ottenere sempre il risultato migliore.</h2>
        <h2 id="container-language-selection">
            <span id="language-ITA" class="wave-animation-element language selected">ITA</span>
            <span class="wave-animation-element">&diams;</span>
            <span id="language-ENG" class="wave-animation-element language not-selected">ENG</span>
            <span class="wave-animation-element">&diams;</span>
            <span id="language-JAP" class="wave-animation-element language not-selected">JAP</span>
        </h2>
    </header>

    <main id="category-selection">
        <section class="category-single-container" id="panini">
            <img id="img-panini" src="imgs/panini.jpg" alt="Panini">
            <h2 class="translate">PANINI</h2>
        </section>

        <section class="category-single-container" id="paste">
            <img id="img-spaghetti" src="imgs/spaghetti.png" alt="">
            <h2 class="translate">PRIMI</h2>
        </section>

        <section class="category-single-container" id="carne">
            <img id="img-carne" src="imgs/carne.jpg" alt="">
            <h2 class="translate">SECONDI</h2>
        </section>

        <section class="category-single-container" id="bevande-alcoliche">
            <img id="img-spritz" src="imgs/spritz.avif" alt="">
            <h2 class="translate">BEVANDE</h2>
        </section>
    </main>

    <footer>

    </footer>
    <script src="scriptMain.js"></script>
    <script src="pageSystem.js"></script>
</body>
</html>
